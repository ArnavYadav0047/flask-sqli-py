{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-3 text-success">Secure Login (fixed)</h3>
        <p class="text-muted small">
          This form uses parameterized queries to prevent SQL injection.
        </p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="Enter username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Enter password" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Login (Secure)</button>
        </form>
        {% if message %}
          <div class="alert alert-info mt-3 mb-0" role="alert">
            {{ message }}
          </div>
        {% endif %}
      </div>
    </div>
    <p class="mt-3 small">
      Compare with the <a href="{{ url_for('login_insecure') }}">insecure version</a> to see the difference.
    </p>
  </div>
</div>
{% endblock %}
